# Установщик Duplexn't. Собирается командой `npm run dist`, выход — release/ (вне git).
# Установщик M0 не публикуется (план M0, KTD-35).

# Технические имена — ASCII: appId, имя exe, имя артефакта. Апостроф живёт только в
# отображаемом названии.
appId: app.duplexnt
productName: "Duplexn't"
executableName: duplexnt

directories:
  output: release
  buildResources: build

# БЕЛЫЙ СПИСОК. По умолчанию electron-builder пакует весь каталог проекта и .gitignore не
# читает — без списка в установщик уехали бы docs/, spikes/ и сырые данные устройства из
# local-test-data/, мимо стража приватности. Production-зависимости (sharp) он добавляет сам.
files:
  - out/**
  - package.json

asar: true
# Нативные бинарники из asar не грузятся. Паттерны явные — рецепт самого sharp;
# автоопределение electron-builder ненадёжно.
asarUnpack:
  - node_modules/sharp/**
  - node_modules/@img/**

# sharp — prebuilt N-API, ABI-стабилен между Node и Electron: пересборка не нужна.
npmRebuild: false

win:
  # Значок «Монограмма D’» (B-7): многоразмерный .ico из buildResources — ресурс exe, ярлыки,
  # «Пуск», установщик и деинсталлятор. Генерируется `npm run icons` из SVG-мастеров рядом.
  icon: build/icon.ico
  target:
    - target: nsis
      arch:
        - x64
  artifactName: duplexnt-${version}-setup.${ext}

# Assisted, per-user: без подписи это даёт меньше трения с UAC. Данные пользователя
# деинсталлятор не трогает.
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  deleteAppDataOnUninstall: false
  artifactName: duplexnt-${version}-setup.${ext}
  # Графика мастера (B-26, handoff installer-art): боковая 164 × 314 на «Добро пожаловать» /
  # «Готово» установщика и деинсталлятора, шапка 150 × 57 на остальных страницах. BMP 24 бит
  # генерируются `npm run installer-art` из SVG-мастеров рядом и коммитятся, как значки.
  installerSidebar: build/installer-sidebar.bmp
  uninstallerSidebar: build/installer-sidebar.bmp
  installerHeader: build/installer-header.bmp

# Полный набор держит тест test/tooling/electron-builder.test.ts: выпавший fuse роняет его.
electronFuses:
  # Выключен с U12. В сессии 4 был временно включён: на нём стояла проверка файрвола из
  # установленного exe (U11).
  runAsNode: false
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  onlyLoadAppFromAsar: true
  # Гейт первого публичного релиза (B-29, U2). Шифрование cookie необратимо — включено до первого
  # релиза; cookie и браузерного хранилища у приложения нет, терять нечего. Целостность asar:
  # electron-builder кладёт хэш заголовка ресурсом exe (`addWinAsarIntegrity`), приложение с
  # подменённым app.asar не запускается; sharp распакован (`asarUnpack`) и проверке не мешает.
  # `file://` интерфейсу больше не нужен (U1) — лишних прав у него нет.
  enableCookieEncryption: true
  enableEmbeddedAsarIntegrityValidation: true
  grantFileProtocolExtraPrivileges: false

# Автообновления и публикации нет.
publish: null
